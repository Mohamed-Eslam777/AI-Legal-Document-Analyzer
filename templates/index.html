<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Document Simplifier</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header" data-aos="fade-down">
            <h1><i class="fas fa-gavel"></i> Legal Document Simplifier</h1>
            <p class="lead">Simplify complex legal documents into easy-to-understand language</p>
        </div>
        
        <div class="form-container" data-aos="fade-up" data-aos-delay="100">
            <div id="assessment-result-badge" class="assessment-badge" style="display: none;">
                <i class="fas fa-info-circle"></i> Document Type: <span id="document-type-span">Awaiting Input...</span>
            </div>
            <form id="simplify-form" action="/simplify" method="POST">
                <div class="documents-wrapper">
                    <div class="form-group document-group">
                        <label for="legal_text_1" class="form-label">
                            <i class="fas fa-file-contract"></i> Document 1
                        </label>
                        <textarea 
                            class="form-control" 
                            id="legal_text_1" 
                            name="legal_text_1" 
                            rows="12" 
                            placeholder="Paste your first legal document here..."
                            required></textarea>
                    </div>
                    <div class="form-group document-group">
                        <label for="legal_text_2" class="form-label">
                            <i class="fas fa-file-contract"></i> Document 2 <span class="optional-label">(Optional - for comparison)</span>
                        </label>
                        <textarea 
                            class="form-control" 
                            id="legal_text_2" 
                            name="legal_text_2" 
                            rows="12" 
                            placeholder="Paste your second legal document here for comparison..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-magic"></i> <span id="submit-button-text">Analyze Document</span>
                </button>
            </form>
        </div>
        
        <div class="results-container" data-aos="fade-up" data-aos-delay="200">
            <h2><i class="fas fa-clipboard-list"></i> Results</h2>
            <div id="results"></div>
            <div id="results-section" style="display: none;">
                <div class="export-button-container">
                    <button id="export-report-btn" class="btn btn-export">
                        <i class="fas fa-download"></i> Save/Print Analysis Report
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="app-footer">
        <p>Made with ❤️ by Mohammed Eslam</p>
        <div class="footer-links">
            <a href="https://wa.me/201050586075" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.linkedin.com/in/mohammed-maklad-469557381/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/Mohamed-Eslam777" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </div>
    </footer>
    
    <!-- AOS JavaScript -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
